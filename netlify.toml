[build]
  publish = "apps/filmcraft-web/dist"
  command = "rustup default stable && rustup target add wasm32-unknown-unknown && wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.5/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C /tmp && cd apps/filmcraft-web && /tmp/trunk build --release web/index.html"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200